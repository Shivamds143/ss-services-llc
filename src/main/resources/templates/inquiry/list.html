<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::extraJs}, null, 'inquiries', 'Inquiries')}">
<th:block th:fragment="content">

<div class="d-flex justify-content-between align-items-center mb-4 mt-2">
    <div>
        <h5 class="mb-1 fw-bold text-dark">Inquiry Management</h5>
        <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0 small">
            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
            <li class="breadcrumb-item active">Inquiries</li>
        </ol></nav>
    </div>
    <a th:href="@{/inquiries/new}" class="btn btn-primary">
        <i class="fas fa-plus me-2"></i>New Inquiry
    </a>
</div>

<!-- Success / Error flash messages -->
<div th:if="${successMsg}" class="alert alert-success alert-dismissible py-2 mb-3 d-flex align-items-center gap-2">
    <i class="fas fa-check-circle"></i>
    <span th:text="${successMsg}"></span>
    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
</div>
<div th:if="${errorMsg}" class="alert alert-danger alert-dismissible py-2 mb-3 d-flex align-items-center gap-2">
    <i class="fas fa-exclamation-circle"></i>
    <span th:text="${errorMsg}"></span>
    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
</div>

<!-- Today filter + Status filter tabs -->
<div class="card border-0 shadow-sm mb-3">
    <div class="card-body py-2 px-3">
        <div class="d-flex gap-2 flex-wrap align-items-center">

            <a th:href="${todayOnly}
                    ? @{/inquiries}
                    : @{/inquiries(todayOnly=true)}"
               class="btn btn-sm position-relative"
               th:classappend="${todayOnly} ? 'btn-success' : 'btn-outline-success'">
                <i class="fas fa-calendar-day me-1"></i>Today
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                      th:if="${todayCount > 0}"
                      th:text="${todayCount}"></span>
            </a>

            <div class="vr mx-1"></div>

            <a th:href="${todayOnly} ? @{/inquiries(todayOnly=true)} : @{/inquiries}"
               class="btn btn-sm"
               th:classappend="${selectedStatus == null or #strings.isEmpty(selectedStatus)} ? 'btn-dark' : 'btn-outline-secondary'">
                All
            </a>

            <a th:each="s : ${statuses}"
               th:href="${todayOnly}
                       ? @{/inquiries(todayOnly=true,status=${s.name()})}
                       : @{/inquiries(status=${s.name()})}"
               class="btn btn-sm"
               th:classappend="${selectedStatus != null and selectedStatus == s.name()} ? 'btn-primary' : 'btn-outline-secondary'"
               th:text="${s.name().replace('_',' ')}">
            </a>

        </div>
    </div>
</div>

<!-- Today mode banner -->
<div th:if="${todayOnly}" class="alert alert-success alert-dismissible py-2 mb-3 d-flex align-items-center gap-2">
    <i class="fas fa-calendar-check"></i>
    <span>Showing <strong>today's inquiries</strong> only.
        <a th:href="@{/inquiries}" class="alert-link ms-1">Show all</a>
    </span>
    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
</div>

<!-- Search bar -->
<div class="card border-0 shadow-sm mb-3">
    <div class="card-body py-2">
        <form th:action="@{/inquiries}" method="get" class="d-flex gap-2 align-items-center">
            <input type="hidden" name="status" th:value="${selectedStatus}"
                   th:if="${selectedStatus != null and not #strings.isEmpty(selectedStatus)}"/>
            <input type="hidden" name="todayOnly" value="true" th:if="${todayOnly}"/>
            <div class="input-group" style="max-width:400px;">
                <span class="input-group-text bg-white">
                    <i class="fas fa-search text-muted"></i>
                </span>
                <input type="text" name="search" class="form-control border-start-0"
                       placeholder="Search customer, mobile, bank..."
                       th:value="${search}"/>
            </div>
            <button type="submit" class="btn btn-primary px-4">Search</button>
            <a th:href="${todayOnly}
                      ? (${selectedStatus != null and not #strings.isEmpty(selectedStatus)}
                          ? @{/inquiries(todayOnly=true,status=${selectedStatus})}
                          : @{/inquiries(todayOnly=true)})
                      : (${selectedStatus != null and not #strings.isEmpty(selectedStatus)}
                          ? @{/inquiries(status=${selectedStatus})}
                          : @{/inquiries})"
               class="btn btn-outline-secondary">Clear</a>
            <span class="text-muted ms-auto small">
                <strong th:text="${totalElements}">0</strong> records found
            </span>
        </form>
    </div>
</div>

<!-- Table -->
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Bank</th>
                        <th>Assigned To</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inq, i : ${inquiries.content}">
                        <td class="text-muted small"
                            th:text="${currentPage * 20 + i.index + 1}"></td>
                        <td class="small"
                            th:text="${#temporals.format(inq.inquiryDate,'dd-MM-yyyy')}"></td>
                        <td>
                            <a th:href="@{/customers/{id}(id=${inq.customer.id})}"
                               class="text-decoration-none fw-semibold text-dark"
                               th:text="${inq.customer.customerName}"></a>
                            <div class="text-muted small"
                                 th:text="${inq.customer.mobileNumber}"></div>
                        </td>
                        <td>
                            <span class="badge bg-primary-subtle text-primary"
                                  th:text="${inq.inquiryType.typeName}"></span>
                            <!-- Show insurance type if present -->
                            <div class="small mt-1"
                                 th:if="${inq.insuranceType != null and !#strings.isEmpty(inq.insuranceType)}">
                                <span class="badge"
                                      style="background:#fff3cd; color:#856404; font-size:10px; border:1px solid #f0c040;"
                                      th:text="${inq.insuranceType}">
                                </span>
                            </div>
                        </td>
                        <td class="small"
                            th:text="${inq.loanAmount != null ? '₹' + #numbers.formatDecimal(inq.loanAmount,0,'COMMA',0,'POINT') : '-'}"></td>
                        <td class="small" th:text="${inq.bankName ?: '-'}"></td>
                        <td class="small"
                            th:text="${inq.assignedTo != null ? inq.assignedTo.fullName : '-'}"></td>

                        <!-- ── QUICK STATUS COLUMN ── -->
                        <td>
                            <div class="dropdown">
                                <button class="btn btn-sm dropdown-toggle border-0 px-2 py-1 fw-semibold"
                                        type="button"
                                        data-bs-toggle="dropdown"
                                        aria-expanded="false"
                                        th:classappend="${inq.status.name() == 'APPROVED'}      ? 'btn-success' :
                                                        (${inq.status.name() == 'REJECTED'}     ? 'btn-danger' :
                                                        (${inq.status.name() == 'NEW'}           ? 'btn-info text-white' :
                                                        (${inq.status.name() == 'DOCUMENTS_PENDING'} ? 'btn-warning text-dark' :
                                                        (${inq.status.name() == 'CLOSED'}        ? 'btn-dark' : 'btn-secondary'))))"
                                        th:text="${inq.status.name().replace('_',' ')}">
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end shadow-sm" style="min-width:160px;">
                                    <li><h6 class="dropdown-header small">Change Status</h6></li>
                                    <li th:each="s : ${statuses}"
                                        th:if="${s.name() != inq.status.name()}">
                                        <form th:action="@{/inquiries/{id}/quick-status(id=${inq.id})}"
                                              method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <input type="hidden" name="status" th:value="${s.name()}"/>
                                            <input type="hidden" name="redirectUrl"
                                                   th:value="${'/inquiries' +
                                                       (selectedStatus != null and not #strings.isEmpty(selectedStatus) ? '?status=' + selectedStatus : '') +
                                                       (todayOnly ? (selectedStatus != null and not #strings.isEmpty(selectedStatus) ? '&todayOnly=true' : '?todayOnly=true') : '') +
                                                       (search != null and not #strings.isEmpty(search) ? (selectedStatus != null or todayOnly ? '&search=' + search : '?search=' + search) : '')}"/>
                                            <button type="submit"
                                                    class="dropdown-item small py-1"
                                                    th:classappend="${s.name() == 'APPROVED'}          ? 'text-success fw-semibold' :
                                                                    (${s.name() == 'REJECTED'}         ? 'text-danger fw-semibold' :
                                                                    (${s.name() == 'DOCUMENTS_PENDING'} ? 'text-warning' :
                                                                    (${s.name() == 'CLOSED'}            ? 'text-dark' : '')))"
                                                    th:text="${s.name().replace('_',' ')}">
                                            </button>
                                        </form>
                                    </li>
                                </ul>
                            </div>
                        </td>
                        <!-- ── END QUICK STATUS ── -->

                        <td>
                            <th:block th:with="pr=${inq.priority.name()}">
                                <span class="badge"
                                      th:classappend="${pr == 'URGENT'} ? 'bg-danger' :
                                                      (${pr == 'HIGH'}   ? 'bg-warning text-dark' :
                                                      (${pr == 'MEDIUM'} ? 'bg-info' : 'bg-light text-dark'))"
                                      th:text="${pr}"></span>
                            </th:block>
                        </td>
                        <td>
                            <div class="d-flex gap-1">
                                <a th:href="@{/inquiries/{id}(id=${inq.id})}"
                                   class="btn btn-sm btn-outline-info" title="View">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a th:href="@{/inquiries/{id}/edit(id=${inq.id})}"
                                   class="btn btn-sm btn-outline-warning" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/followups/new(inquiryId=${inq.id})}"
                                   class="btn btn-sm btn-outline-success" title="Add Follow-up">
                                    <i class="fas fa-phone-alt"></i>
                                </a>
                                <th:block sec:authorize="hasRole('ADMIN')">
                                    <form th:action="@{/inquiries/{id}/delete(id=${inq.id})}"
                                          method="post"
                                          onsubmit="return confirm('Delete this inquiry?')">
                                        <input type="hidden"
                                               th:name="${_csrf.parameterName}"
                                               th:value="${_csrf.token}"/>
                                        <button type="submit"
                                                class="btn btn-sm btn-outline-danger"
                                                title="Delete">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </th:block>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${inquiries.empty}">
                        <td colspan="10" class="text-center py-5 text-muted">
                            <i class="fas fa-file-alt fa-3x mb-3 d-block opacity-25"></i>
                            <span th:text="${todayOnly} ? 'No inquiries added today.' : 'No inquiries found.'"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <div class="card-footer bg-white d-flex justify-content-between align-items-center"
         th:if="${totalPages > 1}">
        <span class="text-muted small">
            Page <span th:text="${currentPage + 1}"></span>
            of <span th:text="${totalPages}"></span>
        </span>
        <nav>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/inquiries(page=${currentPage - 1},search=${search},status=${selectedStatus},todayOnly=${todayOnly})}">«</a>
                </li>
                <li class="page-item"
                    th:each="p : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${p == currentPage} ? 'active'">
                    <a class="page-link"
                       th:href="@{/inquiries(page=${p},search=${search},status=${selectedStatus},todayOnly=${todayOnly})}"
                       th:text="${p + 1}"></a>
                </li>
                <li class="page-item"
                    th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/inquiries(page=${currentPage + 1},search=${search},status=${selectedStatus},todayOnly=${todayOnly})}">»</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

</th:block>

<th:block th:fragment="extraJs">
<script>
// Auto-dismiss flash messages after 3 seconds
setTimeout(function() {
    document.querySelectorAll('.alert-dismissible').forEach(function(el) {
        var bsAlert = bootstrap.Alert.getOrCreateInstance(el);
        if (bsAlert) bsAlert.close();
    });
}, 3000);
</script>
</th:block>
</html>
