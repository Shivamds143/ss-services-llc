<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::content}, null, null, 'employees', 'Employees')}">
<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4 mt-2">
    <div>
        <h5 class="mb-1 fw-bold">Employee Management</h5>
        <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0 small">
            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
            <li class="breadcrumb-item active">Employees</li>
        </ol></nav>
    </div>
    <a th:href="@{/employees/new}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
        <i class="fas fa-user-plus me-2"></i>Add Employee
    </a>
</div>
<div class="card border-0 shadow-sm mb-3">
    <div class="card-body py-2">
        <form th:action="@{/employees}" method="get" class="d-flex gap-2 align-items-center">
            <div class="input-group" style="max-width:400px;">
                <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                <input type="text" name="search" class="form-control border-start-0"
                       placeholder="Search by name, designation, mobile..." th:value="${search}"/>
            </div>
            <button class="btn btn-primary px-4">Search</button>
            <a th:href="@{/employees}" class="btn btn-outline-secondary">Clear</a>
        </form>
    </div>
</div>
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr><th>Emp ID</th><th>Name</th><th>Designation</th><th>Mobile</th><th>Joining Date</th><th>Salary</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${employees.content}">
                        <td><span class="badge bg-secondary" th:text="${e.employeeId}"></span></td>
                        <td>
                            <div class="d-flex align-items-center">
                                <!-- Photo present: show actual uploaded photo -->
                                <img th:if="${e.photoPath != null and !#strings.isEmpty(e.photoPath)}"
                                     th:src="@{'/' + ${e.photoPath}}"
                                     class="rounded-circle me-2"
                                     width="36" height="36"
                                     style="object-fit:cover;"
                                     alt="Photo"/>
                                <!-- No photo: show initials avatar -->
                                <div th:if="${e.photoPath == null or #strings.isEmpty(e.photoPath)}"
                                     class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center
                                            justify-content-center me-2 fw-bold"
                                     style="width:36px;height:36px;font-size:13px;">
                                    <span th:text="${#strings.substring(e.employeeName,0,1).toUpperCase()}"></span>
                                </div>
                                <div>
                                    <a th:href="@{/employees/{id}(id=${e.id})}" class="text-decoration-none fw-semibold text-dark"
                                       th:text="${e.employeeName}"></a>
                                </div>
                            </div>
                        </td>
                        <td class="small" th:text="${e.designation ?: '-'}"></td>
                        <td th:text="${e.mobileNumber}"></td>
                        <td class="small" th:text="${#temporals.format(e.joiningDate,'dd-MM-yyyy')}"></td>
                        <td class="small" th:text="${e.salary != null ? '₹' + #numbers.formatDecimal(e.salary,0,'COMMA',0,'POINT') : '-'}"></td>
                        <td>
                            <span th:if="${e.isActive}" class="badge bg-success">Active</span>
                            <span th:unless="${e.isActive}" class="badge bg-danger">Inactive</span>
                        </td>
                        <td>
                            <div class="d-flex gap-1">
                                <a th:href="@{/employees/{id}(id=${e.id})}" class="btn btn-sm btn-outline-info"><i class="fas fa-eye"></i></a>
                                <a th:href="@{/employees/{id}/edit(id=${e.id})}" class="btn btn-sm btn-outline-warning"
                                   sec:authorize="hasRole('ADMIN')"><i class="fas fa-edit"></i></a>
                                <a th:href="@{/attendance/employee/{id}(id=${e.id})}" class="btn btn-sm btn-outline-secondary">
                                    <i class="fas fa-clipboard-check"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${employees.empty}">
                        <td colspan="8" class="text-center py-5 text-muted">
                            <i class="fas fa-id-badge fa-3x mb-3 d-block opacity-25"></i>No employees found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center" th:if="${totalPages > 1}">
        <span class="text-muted small">Page <span th:text="${currentPage + 1}"></span> of <span th:text="${totalPages}"></span></span>
        <nav><ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:classappend="${currentPage==0}?'disabled'">
                <a class="page-link" th:href="@{/employees(page=${currentPage-1},search=${search})}">«</a></li>
            <li class="page-item" th:each="p : ${#numbers.sequence(0,totalPages-1)}" th:classappend="${p==currentPage}?'active'">
                <a class="page-link" th:href="@{/employees(page=${p},search=${search})}" th:text="${p+1}"></a></li>
            <li class="page-item" th:classappend="${currentPage+1>=totalPages}?'disabled'">
                <a class="page-link" th:href="@{/employees(page=${currentPage+1},search=${search})}">»</a></li>
        </ul></nav>
    </div>
</div>
</th:block>
</html>
