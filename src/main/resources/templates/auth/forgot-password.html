<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Forgot Password | Financial CRM</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.2/css/all.min.css}"/>
    <style>
        body { background: linear-gradient(135deg,#0f2027,#203a43,#2c5364); min-height:100vh; }
        .card { border-radius:16px; border:none; box-shadow:0 20px 60px rgba(0,0,0,.4); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="container" style="max-width:420px;">
    <div class="card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="fas fa-lock-open fa-3x text-primary mb-3 d-block"></i>
                <h5 class="fw-bold">Forgot Password?</h5>
                <p class="text-muted small">Enter your email address and we'll send you a reset link.</p>
            </div>
            <div th:if="${successMsg}" class="alert alert-success py-2">
                <i class="fas fa-check-circle me-2"></i><span th:text="${successMsg}"></span>
            </div>
            <form th:action="@{/auth/forgot-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="your@email.com" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="fas fa-paper-plane me-2"></i>Send Reset Link
                </button>
                <div class="text-center">
                    <a th:href="@{/auth/login}" class="text-muted small">
                        <i class="fas fa-arrow-left me-1"></i>Back to Login
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
