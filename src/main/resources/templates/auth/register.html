<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<form th:action="@{/auth/register}" method="post">

    <input type="text"
           name="fullName"
           placeholder="Full Name"
           required>

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <input type="text"
           name="mobile"
           placeholder="Mobile">

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <button type="submit">
        Register
    </button>

</form>

</body>
</html>
