<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reset Password | Financial CRM</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}"/>
    <style>
        body { background: linear-gradient(135deg,#0f2027,#203a43,#2c5364); min-height:100vh; }
        .card { border-radius:16px; border:none; box-shadow:0 20px 60px rgba(0,0,0,.4); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="container" style="max-width:420px;">
    <div class="card">
        <div class="card-body p-4">
            <h5 class="fw-bold text-center mb-4">Reset Password</h5>
            <div th:if="${errorMsg}" class="alert alert-danger py-2" th:text="${errorMsg}"></div>
            <form th:action="@{/auth/reset-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="token" th:value="${token}"/>
                <div class="mb-3">
                    <label class="form-label fw-semibold">New Password</label>
                    <input type="password" name="newPassword" class="form-control" minlength="8" required/>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirm Password</label>
                    <input type="password" name="confirmPassword" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100">Reset Password</button>
            </form>
        </div>
    </div>
</div>
<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
