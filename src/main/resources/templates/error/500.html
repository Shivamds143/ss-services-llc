<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>500 Error | Financial CRM</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}"/>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
<div class="text-center p-5">
    <h1 class="display-1 fw-bold text-danger">500</h1>
    <h4 class="fw-bold mb-3">Internal Server Error</h4>
    <p class="text-muted mb-4" th:text="${errorMessage ?: 'Something went wrong. Please try again.'}"></p>
    <a th:href="@{/dashboard}" class="btn btn-danger px-4">Back to Dashboard</a>
</div>
</body>
</html>
