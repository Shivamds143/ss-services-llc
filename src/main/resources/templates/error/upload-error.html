<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Upload Error</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}"/>
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh">
    <div class="text-center">
        <h1 class="display-1 fw-bold text-warning">⚠️</h1>
        <h2 class="mb-3">Upload Failed</h2>
        <p class="text-muted mb-4" th:text="${errorMessage ?: 'File size exceeds the maximum allowed limit (5MB).'}">
            File size exceeds the maximum allowed limit (5MB).
        </p>
        <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
    </div>
</div>
</body>
</html>
