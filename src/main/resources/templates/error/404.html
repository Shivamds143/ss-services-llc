<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>404 Not Found | Financial CRM</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.2/css/all.min.css}"/>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
<div class="text-center p-5">
    <i class="fas fa-search fa-5x text-muted mb-4 d-block opacity-25"></i>
    <h1 class="display-1 fw-bold text-primary">404</h1>
    <h4 class="fw-bold mb-3">Page Not Found</h4>
    <p class="text-muted mb-4" th:text="${errorMessage ?: 'The page you requested could not be found.'}"></p>
    <a th:href="@{/dashboard}" class="btn btn-primary px-4">
        <i class="fas fa-home me-2"></i>Go to Dashboard
    </a>
</div>
</body>
</html>
