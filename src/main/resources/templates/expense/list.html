<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, null, null, 'expenses', 'Expenses')}">
<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-3 mt-2">
    <h5 class="fw-bold mb-0">Office Expense Management</h5>
    <a th:href="@{/expenses/new}" class="btn btn-danger">
        <i class="fas fa-plus me-2"></i>Add Expense
    </a>
</div>

<!-- Summary card -->
<div class="row g-3 mb-3">
    <div class="col-md-4">
        <div class="card border-0 shadow-sm text-center py-3 bg-danger-subtle">
            <div class="fs-4 fw-bold text-danger">
                ₹<span th:text="${#numbers.formatDecimal(monthlyTotal,0,'COMMA',0,'POINT')}">0</span>
            </div>
            <div class="text-muted small">This Month's Total</div>
        </div>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Sub-Category</th>
                        <th>Amount</th>
                        <th>Mode</th>
                        <th>Vendor</th>
                        <th>Bill No.</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e,i : ${expenses.content}">
                        <td class="text-muted small" th:text="${currentPage*20+i.index+1}"></td>
                        <td class="small" th:text="${#temporals.format(e.expenseDate,'dd-MM-yyyy')}"></td>
                        <td>
                            <span class="badge bg-warning text-dark"
                                  th:text="${e.category.categoryName}"></span>
                        </td>
                        <td>
                            <span th:if="${e.subCategory != null}"
                                  class="badge bg-info text-dark"
                                  th:text="${e.subCategory.categoryName}"></span>
                            <span th:if="${e.subCategory == null}" class="text-muted small">-</span>
                        </td>
                        <td class="fw-semibold text-danger">
                            ₹<span th:text="${#numbers.formatDecimal(e.amount,0,'COMMA',0,'POINT')}"></span>
                        </td>
                        <td class="small" th:text="${e.paymentMode}"></td>
                        <td class="small" th:text="${e.vendorName ?: '-'}"></td>
                        <td class="small" th:text="${e.billNumber ?: '-'}"></td>
                        <td>
                            <div class="d-flex gap-1">
                                <a th:href="@{/expenses/{id}/edit(id=${e.id})}"
                                   class="btn btn-sm btn-outline-warning">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <form th:action="@{/expenses/{id}/delete(id=${e.id})}" method="post"
                                      onsubmit="return confirm('Delete this expense?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${expenses.empty}">
                        <td colspan="9" class="text-center py-4 text-muted">No expense records found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between" th:if="${totalPages > 1}">
        <span class="text-muted small">
            Page <span th:text="${currentPage+1}"></span> of <span th:text="${totalPages}"></span>
        </span>
        <nav><ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:classappend="${currentPage==0}?'disabled'">
                <a class="page-link" th:href="@{/expenses(page=${currentPage-1})}">«</a>
            </li>
            <li class="page-item" th:each="p : ${#numbers.sequence(0,totalPages-1)}"
                th:classappend="${p==currentPage}?'active'">
                <a class="page-link" th:href="@{/expenses(page=${p})}" th:text="${p+1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage+1>=totalPages}?'disabled'">
                <a class="page-link" th:href="@{/expenses(page=${currentPage+1})}">»</a>
            </li>
        </ul></nav>
    </div>
</div>
</th:block>
</html>
