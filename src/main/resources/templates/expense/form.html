<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, null, null, 'expenses', 'Add Expense')}">
<th:block th:fragment="content">

<div class="d-flex justify-content-between align-items-center mb-4 mt-2">
    <h5 class="fw-bold">Record Office Expense</h5>
    <a th:href="@{/expenses}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-2"></i>Back
    </a>
</div>

<div class="card border-0 shadow-sm" style="max-width:750px;">
    <div class="card-header bg-danger text-white py-3">
        <h6 class="mb-0"><i class="fas fa-minus-circle me-2"></i>Expense Details</h6>
    </div>
    <div class="card-body p-4">
        <form th:action="${expense.id == null ? '/expenses/save' : '/expenses/' + expense.id + '/save'}"
              method="post" th:object="${expense}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="row g-3">

                <!-- 1. Expense Date -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        Expense Date <span class="text-danger">*</span>
                    </label>
                    <input type="date" th:field="*{expenseDate}" class="form-control" required/>
                </div>

                <!-- 2. Expense Entry Type -->
                <div class="col-12">
                    <label class="form-label fw-semibold">Expense Entry Type</label>
                    <div class="btn-group" role="group" aria-label="Expense type chooser">
                        <input type="radio" class="btn-check" name="expenseType" id="expenseTypeCategory" value="category"
                               th:checked="${expense.category == null or expense.category.categoryCode != 'MANUAL_EXPENSE'}" autocomplete="off">
                        <label class="btn btn-outline-secondary" for="expenseTypeCategory">Category Expense</label>

                        <input type="radio" class="btn-check" name="expenseType" id="expenseTypeManual" value="manual"
                               th:checked="${expense.category != null and expense.category.categoryCode == 'MANUAL_EXPENSE'}" autocomplete="off">
                        <label class="btn btn-outline-secondary" for="expenseTypeManual">Manual Expense</label>
                    </div>
                </div>

                <!-- 3. Expense Category -->
                <div class="col-md-6" id="categoryWrapper">
                    <label class="form-label fw-semibold">
                        Expense Category <span class="text-danger">*</span>
                    </label>
                    <select name="categoryId" id="categoryId" class="form-select">
                        <option value="">-- Select Category --</option>
                        <option th:each="c : ${categories}"
                                th:value="${c.id}"
                                th:text="${c.categoryName}"
                                th:selected="${expense.category != null and expense.category.id == c.id}">
                        </option>
                    </select>
                </div>

                <!-- 4. Manual Expense Description -->
                <div class="col-md-6" id="manualWrapper" style="display:none;">
                    <label class="form-label fw-semibold">
                        Manual Expense Description <span class="text-danger">*</span>
                    </label>
                    <input type="text" name="manualDescription" id="manualDescription" th:value="${expense.category != null and expense.category.categoryCode == 'MANUAL_EXPENSE' ? expense.description : ''}"
                           class="form-control" placeholder="Enter custom expense name"
                           minlength="3" />
                </div>

                <!-- 5. Sub-Category (full width, hidden until category selected) -->
                <div class="col-12" id="subCategoryWrapper" style="display:none;">
                    <label class="form-label fw-semibold">Sub-Category</label>
                    <select name="subCategoryId" id="subCategoryId" class="form-select">
                        <option value="">-- Select Sub-Category --</option>
                        <option th:if="${subCategories != null}"
                                th:each="sc : ${subCategories}"
                                th:value="${sc.id}"
                                th:text="${sc.categoryName}"
                                th:selected="${expense.subCategory != null
                                              and expense.subCategory.id == sc.id}">
                        </option>
                    </select>
                </div>

                <!-- 4. Amount -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        Amount (₹) <span class="text-danger">*</span>
                    </label>
                    <input type="number" th:field="*{amount}" class="form-control"
                           step="0.01" min="0.01" required placeholder="0.00"/>
                </div>

                <!-- 5. Payment Mode -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        Payment Mode <span class="text-danger">*</span>
                    </label>
                    <select name="paymentMode" class="form-select" required>
                        <option value="">-- Select Mode --</option>
                        <option th:each="m : ${paymentModes}"
                                th:value="${m}"
                                th:text="${m.name().replace('_',' ')}"
                                th:selected="${expense.paymentMode == m}">
                        </option>
                    </select>
                </div>

                <!-- 6. Vendor Name -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Vendor Name</label>
                    <input type="text" th:field="*{vendorName}" class="form-control"
                           placeholder="Vendor / Party name"/>
                </div>

                <!-- 7. Bill Number -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Bill Number</label>
                    <input type="text" th:field="*{billNumber}" class="form-control"
                           placeholder="Invoice / Bill number"/>
                </div>

                <!-- 8. Description -->
                <div class="col-12">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="2"
                              placeholder="Expense details..."></textarea>
                </div>

                <!-- 9. Notes -->
                <div class="col-12">
                    <label class="form-label fw-semibold">Notes</label>
                    <textarea th:field="*{notes}" class="form-control" rows="3"
                              placeholder="Any additional notes..."></textarea>
                </div>

            </div>
            <!-- end row -->

            <hr class="my-4"/>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger px-4">
                    <i class="fas fa-save me-2"></i>Save Expense
                </button>
                <a th:href="@{/expenses}" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>

        </form>
    </div>
</div>

<script th:inline="javascript">
(function () {
    const categorySelect   = document.getElementById('categoryId');
    const subWrapper       = document.getElementById('subCategoryWrapper');
    const subSelect        = document.getElementById('subCategoryId');
    const preSelectedSubId = /*[[${expense.subCategory != null ? expense.subCategory.id : ''}]]*/ '';

    function loadSubCategories(parentId, preselectId) {
        if (!parentId) {
            subWrapper.style.display = 'none';
            subSelect.innerHTML = '<option value="">-- Select Sub-Category --</option>';
            return;
        }

        fetch('/expenses/sub-categories?parentId=' + parentId)
            .then(function(r) {
                if (!r.ok) throw new Error('Network error');
                return r.json();
            })
            .then(function(data) {
                if (!data || data.length === 0) {
                    subWrapper.style.display = 'none';
                    subSelect.innerHTML = '<option value="">-- Select Sub-Category --</option>';
                    return;
                }
                subWrapper.style.display = 'block';
                var options = '<option value="">-- Select Sub-Category --</option>';
                data.forEach(function(sc) {
                    var selected = String(sc.id) === String(preselectId) ? 'selected' : '';
                    options += '<option value="' + sc.id + '" ' + selected + '>' + sc.name + '</option>';
                });
                subSelect.innerHTML = options;
            })
            .catch(function(err) {
                console.error('Sub-category load error:', err);
                subWrapper.style.display = 'none';
            });
    }

    const expenseTypeCategory = document.getElementById('expenseTypeCategory');
    const expenseTypeManual   = document.getElementById('expenseTypeManual');
    const categoryWrapper     = document.getElementById('categoryWrapper');
    const manualWrapper       = document.getElementById('manualWrapper');

    function toggleExpenseType() {
        const manualMode = expenseTypeManual.checked;
        categoryWrapper.style.display = manualMode ? 'none' : 'block';
        manualWrapper.style.display   = manualMode ? 'block' : 'none';
        if (!manualMode) {
            if (categorySelect.value) {
                loadSubCategories(categorySelect.value, preSelectedSubId);
            }
        } else {
            subWrapper.style.display = 'none';
        }
    }

    // On category change
    categorySelect.addEventListener('change', function () {
        loadSubCategories(this.value, '');
    });

    expenseTypeCategory.addEventListener('change', toggleExpenseType);
    expenseTypeManual.addEventListener('change', toggleExpenseType);

    // On page load — pre-fill sub-categories for edit mode
    toggleExpenseType();
    if (categorySelect.value && !expenseTypeManual.checked) {
        loadSubCategories(categorySelect.value, preSelectedSubId);
    }
})();
</script>

</th:block>
</html>
