<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, null, null, 'users', 'Add User')}">
<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4 mt-2">
    <h5 class="fw-bold">Create New User</h5>
    <a th:href="@{/admin/users}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Back</a>
</div>
<div class="card border-0 shadow-sm" style="max-width:600px;">
    <div class="card-header bg-primary text-white py-3">
        <h6 class="mb-0"><i class="fas fa-user-plus me-2"></i>User Information</h6>
    </div>
    <div class="card-body p-4">
        <form th:action="@{/admin/users/save}" method="post" th:object="${user}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{username}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{fullName}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                    <input type="email" th:field="*{email}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Mobile</label>
                    <input type="tel" th:field="*{mobile}" class="form-control"/>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                    <input type="password" name="rawPassword" class="form-control" minlength="8" required/>
                    <div class="form-text">Minimum 8 characters.</div>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Roles <span class="text-danger">*</span></label>
                    <div class="d-flex gap-3 mt-1">
                        <div th:each="r : ${allRoles}" class="form-check">
                            <input class="form-check-input" type="checkbox" name="roleIds"
                                   th:value="${r.id}" th:id="${'role'+r.id}"/>
                            <label class="form-check-label" th:for="${'role'+r.id}"
                                   th:text="${r.roleName.replace('ROLE_','')}"></label>
                        </div>
                    </div>
                </div>
            </div>
            <hr class="my-4"/>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-2"></i>Create User</button>
                <a th:href="@{/admin/users}" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
</th:block>
</html>
