<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, null, null, 'users', 'User Management')}">
<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4 mt-2">
    <h5 class="fw-bold">User Management</h5>
    <a th:href="@{/admin/users/new}" class="btn btn-primary"><i class="fas fa-user-plus me-2"></i>Add User</a>
</div>
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Roles</th>
                        <th>Status</th>
                        <th>Last Login</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u,i : ${users.content}">
                        <td class="text-muted small" th:text="${currentPage*20+i.index+1}"></td>
                        <td class="fw-semibold" th:text="${u.username}"></td>
                        <td th:text="${u.fullName}"></td>
                        <td class="small" th:text="${u.email}"></td>
                        <td>
                            <span th:each="r : ${u.roles}" class="badge bg-primary me-1"
                                  th:text="${r.roleName.replace('ROLE_','')}"></span>
                        </td>
                        <td>
                            <span th:if="${u.isActive}" class="badge bg-success">Active</span>
                            <span th:unless="${u.isActive}" class="badge bg-danger">Inactive</span>
                        </td>
                        <td class="small" th:text="${u.lastLogin != null ? #temporals.format(u.lastLogin,'dd-MM-yyyy HH:mm') : 'Never'}"></td>
                        <td>
                            <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-sm btn-outline-warning me-1">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/admin/users/{id}/toggle-active(id=${u.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${u.isActive} ? 'btn-outline-danger' : 'btn-outline-success'"
                                        th:title="${u.isActive} ? 'Deactivate' : 'Activate'">
                                    <i class="fas" th:classappend="${u.isActive} ? 'fa-ban' : 'fa-check'"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${users.empty}">
                        <td colspan="8" class="text-center py-4 text-muted">No users found.</td>
                    </tr>
                </tbody>	
            </table>
        </div>
    </div>
</div>
</th:block>
</html>
