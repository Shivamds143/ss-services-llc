<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::extraJs}, null, 'income',
                  ${editMode ? 'Edit Income Entry' : 'Add Income Entry'})}">
<th:block th:fragment="content">

<div class="d-flex justify-content-between align-items-center mb-3 mt-2">
    <h5 class="fw-bold mb-0">
        <i class="fas fa-plus-circle text-success me-2" th:unless="${editMode}"></i>
        <i class="fas fa-edit text-warning me-2" th:if="${editMode}"></i>
        <span th:text="${editMode ? 'Edit Income Entry' : 'Record New Income'}">Income Entry</span>
    </h5>
    <a th:href="@{/income-entries}" class="btn btn-sm btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i>Back to List
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-xl-9 col-lg-10">
        <div class="card border-0 shadow-sm">
            <div class="card-header py-3 px-4 bg-success-subtle">
                <span class="fw-semibold text-dark"
                      th:text="${editMode ? 'Update Income Entry' : 'New Income Entry'}">Income Entry</span>
            </div>
            <div class="card-body p-4">

                <form th:action="${editMode ? '/income-entries/' + formDTO.id + '/update' : '/income-entries/save'}"
                      th:object="${formDTO}"
                      method="post" id="incomeForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <th:block th:if="${editMode}">
                        <input type="hidden" th:field="*{id}"/>
                    </th:block>

                    <!-- Global error summary -->
                    <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
                        <ul class="mb-0">
                            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                        </ul>
                    </div>

                    <div class="row g-3">

                        <!-- Income Date -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">
                                Income Date <span class="text-danger">*</span>
                            </label>
                            <input type="date" th:field="*{incomeDate}" class="form-control" required/>
                        </div>

                        <!-- Category -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">
                                Category <span class="text-danger">*</span>
                            </label>
                            <select th:field="*{incomeCategoryId}" class="form-select" required>
                                <option value="">-- Select Category --</option>
                                <option th:each="c : ${categories}"
                                        th:value="${c.id}"
                                        th:text="${c.categoryName}">
                                </option>
                            </select>
                        </div>

                        <!-- Amount -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">
                                Amount (₹) <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" th:field="*{amount}" class="form-control"
                                       step="0.01" min="0.01" placeholder="0.00" required/>
                            </div>
                        </div>

                        <!-- Payment Mode -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">
                                Payment Mode <span class="text-danger">*</span>
                            </label>
                            <select th:field="*{paymentMode}" class="form-select" required>
                                <option value="">-- Select Mode --</option>
                                <option th:each="pm : ${paymentModes}"
                                        th:value="${pm.name()}"
                                        th:text="${pm.name().replace('_',' ')}">
                                </option>
                            </select>
                        </div>

                        <!-- Transaction Reference -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Transaction Ref #</label>
                            <input type="text" th:field="*{transactionReference}" class="form-control"
                                   placeholder="UTR / Cheque No. / Receipt No."/>
                            <div class="form-text small text-muted">Optional for Cash; recommended for UPI/Bank</div>
                        </div>

                        <!-- Customer -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Customer</label>
                            <select th:field="*{customerId}" class="form-select">
                                <option value="">-- No Specific Customer --</option>
                                <option th:each="c : ${customers}"
                                        th:value="${c.id}"
                                        th:text="${c.customerName + ' (' + c.mobileNumber + ')'}">
                                </option>
                            </select>
                        </div>

                        <!-- Employee -->
                        <!-- Employee -->
<div class="col-md-4">
    <label class="form-label fw-semibold">Employee</label>
    <select th:field="*{employeeId}" class="form-select">
        <option value="">-- No Specific Employee --</option>
        <option th:each="e : ${employees}"
                th:value="${e.id}"
                th:text="${e.employeeName}">
        </option>
    </select>
</div>

                        <!-- Remarks -->
                        <div class="col-12">
                            <label class="form-label fw-semibold">Remarks / Notes</label>
                            <textarea th:field="*{remarks}" class="form-control" rows="3"
                                      placeholder="Additional details about this income entry..."></textarea>
                        </div>

                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success px-4">
                            <i class="fas fa-save me-2"></i>
                            <span th:text="${editMode ? 'Update Entry' : 'Save Income'}">Save</span>
                        </button>
                        <a th:href="@{/income-entries}" class="btn btn-outline-secondary px-4">
                            <i class="fas fa-times me-2"></i>Cancel
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
</th:block>
</html>
