<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::extraJs}, ~{}, 'income-entries', 'Income Entries')}">

<th:block th:fragment="content">

<!-- Page Header -->
<div class="d-flex justify-content-between align-items-center mb-3 mt-2">
    <h5 class="fw-bold mb-0"><i class="fas fa-plus-circle text-success me-2"></i>Income Entries</h5>
    <div class="d-flex gap-2">
        <a th:href="@{/income-dashboard}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-tachometer-alt me-1"></i>Dashboard
        </a>
        <sec:authorize access="hasAnyRole('ADMIN','MANAGER')">
        <a th:href="@{/income-entries/new}" class="btn btn-success btn-sm">
            <i class="fas fa-plus me-1"></i>Add Income
        </a>
        </sec:authorize>
    </div>
</div>

<!-- Summary Cards -->
<div class="row g-3 mb-3">
    <div class="col-md-3 col-6">
        <div class="card border-0 shadow-sm text-center py-2 bg-success-subtle">
            <div class="fs-5 fw-bold text-success">
                ₹<span th:text="${#numbers.formatDecimal(summary?.filteredTotal ?: 0, 0, 'COMMA', 0, 'POINT')}">0</span>
            </div>
            <div class="text-muted small">Filtered Total</div>
        </div>
    </div>
    <div class="col-md-3 col-6">
        <div class="card border-0 shadow-sm text-center py-2">
            <div class="fs-5 fw-bold text-dark" th:text="${totalElements ?: 0}">0</div>
            <div class="text-muted small">Total Entries</div>
        </div>
    </div>
    <div class="col-md-3 col-6">
        <div class="card border-0 shadow-sm text-center py-2 bg-primary-subtle">
            <div class="fs-5 fw-bold text-primary">
                ₹<span th:text="${#numbers.formatDecimal(summary?.currentMonthTotal ?: 0, 0, 'COMMA', 0, 'POINT')}">0</span>
            </div>
            <div class="text-muted small">This Month</div>
        </div>
    </div>
    <div class="col-md-3 col-6">
        <div class="card border-0 shadow-sm text-center py-2 bg-warning-subtle">
            <div class="fs-5 fw-bold text-warning" th:text="${summary?.currentMonthCount ?: 0}">0</div>
            <div class="text-muted small">Month Entries</div>
        </div>
    </div>
</div>

<!-- Search & Filter Form -->
<div class="card border-0 shadow-sm mb-3">
    <div class="card-header bg-white py-2 px-3">
        <a class="text-decoration-none text-dark fw-semibold" data-bs-toggle="collapse" href="#filterSection">
            <i class="fas fa-filter me-2 text-success"></i>Search &amp; Filter
            <i class="fas fa-chevron-down ms-2 small"></i>
        </a>
    </div>
    <div class="collapse show" id="filterSection">
        <div class="card-body">
            <form th:action="@{/income-entries}" method="get" id="filterForm">
                <div class="row g-2">
                    <div class="col-md-3 col-6">
                        <label class="form-label small">From Date</label>
                        <input type="date" name="fromDate" class="form-control form-control-sm"
                               th:value="${filter?.fromDate}"/>
                    </div>
                    <div class="col-md-3 col-6">
                        <label class="form-label small">To Date</label>
                        <input type="date" name="toDate" class="form-control form-control-sm"
                               th:value="${filter?.toDate}"/>
                    </div>
                    <div class="col-md-3 col-6">
                        <label class="form-label small">Category Group</label>
                        <select name="categoryGroup" class="form-select form-select-sm">
                            <option value="">All Groups</option>
                            <option th:each="g : ${categoryGroups}" th:value="${g}" th:text="${g}"
                                    th:selected="${filter?.categoryGroup == g}">Group</option>
                        </select>
                    </div>
                    <div class="col-md-3 col-6">
                        <label class="form-label small">Category</label>
                        <select name="categoryId" class="form-select form-select-sm">
                            <option value="">All Categories</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.categoryName}"
                                    th:selected="${filter?.categoryId == c.id}">Category</option>
                        </select>
                    </div>
                    <div class="col-md-3 col-6">
                        <label class="form-label small">Payment Mode</label>
                        <select name="paymentMode" class="form-select form-select-sm">
                            <option value="">All Modes</option>
                            <option th:each="pm : ${paymentModes}" th:value="${pm.name()}"
                                    th:text="${pm.displayName}"
                                    th:selected="${filter?.paymentMode?.name() == pm.name()}">Mode</option>
                        </select>
                    </div>
                    <div class="col-md-3 col-6">
                        <label class="form-label small">Employee</label>
                        <select name="employeeId" class="form-select form-select-sm">
                            <option value="">All Employees</option>
                            <option th:each="emp : ${employees}" th:value="${emp.id}"
                                    th:text="${emp.employeeName}"
                                    th:selected="${filter?.employeeId == emp.id}">Employee</option>
                        </select>
                    </div>
                    <div class="col-md-3 col-6">
                        <label class="form-label small">Min Amount (₹)</label>
                        <input type="number" name="minAmount" step="0.01" class="form-control form-control-sm"
                               placeholder="0" th:value="${filter?.minAmount}"/>
                    </div>
                    <div class="col-md-3 col-6">
                        <label class="form-label small">Max Amount (₹)</label>
                        <input type="number" name="maxAmount" step="0.01" class="form-control form-control-sm"
                               placeholder="Any" th:value="${filter?.maxAmount}"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small">Search (Customer / Ref / Remarks)</label>
                        <input type="text" name="search" class="form-control form-control-sm"
                               placeholder="Type to search..." th:value="${filter?.search}"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Sort By</label>
                        <select name="sortBy" class="form-select form-select-sm">
                            <option value="incomeDate" th:selected="${filter?.sortBy == 'incomeDate' or filter?.sortBy == null}">Date</option>
                            <option value="amount" th:selected="${filter?.sortBy == 'amount'}">Amount</option>
                            <option value="createdAt" th:selected="${filter?.sortBy == 'createdAt'}">Created At</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Order</label>
                        <select name="sortDir" class="form-select form-select-sm">
                            <option value="desc" th:selected="${filter?.sortDir == 'desc' or filter?.sortDir == null}">Newest First</option>
                            <option value="asc" th:selected="${filter?.sortDir == 'asc'}">Oldest First</option>
                        </select>
                    </div>
                </div>
                <div class="mt-2 d-flex gap-2">
                    <button type="submit" class="btn btn-success btn-sm">
                        <i class="fas fa-search me-1"></i>Search
                    </button>
                    <a th:href="@{/income-entries}" class="btn btn-outline-secondary btn-sm">
                        <i class="fas fa-times me-1"></i>Clear
                    </a>
                    <a th:href="@{/income-reports}" class="btn btn-outline-info btn-sm ms-auto">
                        <i class="fas fa-chart-bar me-1"></i>Reports
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Entries Table -->
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="incomeTable">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>
                            <a th:href="@{/income-entries(sortBy='incomeDate',sortDir=${filter?.sortDir=='asc'?'desc':'asc'},
                               fromDate=${filter?.fromDate},toDate=${filter?.toDate},
                               categoryId=${filter?.categoryId},paymentMode=${filter?.paymentMode},
                               employeeId=${filter?.employeeId},search=${filter?.search})}"
                               class="text-Black text-decoration-none">
                                Date
                                <i class="fas fa-sort ms-1 small"></i>
                            </a>
                        </th>
                        <th>Category</th>
                        <th>Customer</th>
                        <th>Employee</th>
                        <th>
                            <a th:href="@{/income-entries(sortBy='amount',sortDir=${filter?.sortDir=='asc'?'desc':'asc'},
                               fromDate=${filter?.fromDate},toDate=${filter?.toDate},
                               categoryId=${filter?.categoryId},paymentMode=${filter?.paymentMode},
                               employeeId=${filter?.employeeId},search=${filter?.search})}"
                               class="text-Black text-decoration-none">
                                Amount <i class="fas fa-sort ms-1 small"></i>
                            </a>
                        </th>
                        <th>Mode</th>
                        <th>Ref #</th>
                        <th>By</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e, i : ${incomes}">
                        <td class="text-muted small" th:text="${currentPage * 20 + i.index + 1}"></td>
                        <td class="small fw-semibold" th:text="${#temporals.format(e.incomeDate,'dd-MM-yyyy')}"></td>
                        <td>
                            <div>
                                <span class="badge bg-success-subtle text-success border border-success-subtle small"
                                      th:text="${e.categoryName}">-</span>
                            </div>
                            <div class="text-muted" style="font-size:10px;" th:text="${e.categoryGroup}"></div>
                        </td>
                        <td class="small" th:text="${e.customerName ?: '-'}"></td>
                        <td class="small" th:text="${e.employeeName ?: '-'}"></td>
                        <td class="fw-bold text-success small">
                            ₹<span th:text="${#numbers.formatDecimal(e.amount, 0, 'COMMA', 2, 'POINT')}"></span>
                        </td>
                        <td>
                            <span class="badge bg-secondary-subtle text-secondary" th:text="${e.paymentModeDisplay}">-</span>
                        </td>
                        <td class="small text-muted" th:text="${e.transactionReference ?: '-'}"></td>
                        <td class="small text-muted" th:text="${e.createdByUsername ?: '-'}"></td>
                        <td>
                            <div class="d-flex gap-1">
                                <a th:href="@{/income-entries/{id}(id=${e.id})}"
                                   class="btn btn-sm btn-outline-success" title="View">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <sec:authorize access="hasAnyRole('ADMIN','MANAGER')">
                                <a th:href="@{/income-entries/{id}/edit(id=${e.id})}"
                                   class="btn btn-sm btn-outline-warning" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </a>
                                </sec:authorize>
                                <sec:authorize access="hasRole('ADMIN')">
                                <form th:action="@{/income-entries/{id}/delete(id=${e.id})}" method="post"
                                      onsubmit="return confirm('Delete this income entry?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                                </sec:authorize>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${incomes == null or #lists.isEmpty(incomes)}">
                        <td colspan="10" class="text-center py-5 text-muted">
                            <i class="fas fa-inbox fs-2 mb-2 d-block"></i>
                            No income entries found. <a th:href="@{/income-entries/new}">Add one now.</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <div class="card-footer bg-white d-flex flex-wrap justify-content-between align-items-center gap-2"
         th:if="${totalPages > 1}">
        <span class="text-muted small">
            Showing page <strong th:text="${currentPage + 1}"></strong> of
            <strong th:text="${totalPages}"></strong>
            (<span th:text="${totalElements}"></span> records)
        </span>
        <nav>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/income-entries(page=${currentPage-1},sortBy=${filter?.sortBy},sortDir=${filter?.sortDir},
                                   fromDate=${filter?.fromDate},toDate=${filter?.toDate},
                                   categoryId=${filter?.categoryId},paymentMode=${filter?.paymentMode},
                                   employeeId=${filter?.employeeId},search=${filter?.search})}">«</a>
                </li>
                <th:block th:each="p : ${#numbers.sequence(0, totalPages - 1)}">
                    <li class="page-item" th:classappend="${p == currentPage} ? 'active'"
                        th:if="${p <= 2 or p >= totalPages - 3 or (p >= currentPage - 2 and p <= currentPage + 2)}">
                        <a class="page-link" th:text="${p + 1}"
                           th:href="@{/income-entries(page=${p},sortBy=${filter?.sortBy},sortDir=${filter?.sortDir},
                                       fromDate=${filter?.fromDate},toDate=${filter?.toDate},
                                       categoryId=${filter?.categoryId},paymentMode=${filter?.paymentMode},
                                       employeeId=${filter?.employeeId},search=${filter?.search})}">1</a>
                    </li>
                </th:block>
                <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/income-entries(page=${currentPage+1},sortBy=${filter?.sortBy},sortDir=${filter?.sortDir},
                                   fromDate=${filter?.fromDate},toDate=${filter?.toDate},
                                   categoryId=${filter?.categoryId},paymentMode=${filter?.paymentMode},
                                   employeeId=${filter?.employeeId},search=${filter?.search})}">»</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

</th:block>

<th:block th:fragment="extraJs">
<script>
// Quick date presets
function setDateRange(preset) {
    const today = new Date();
    let from, to;
    to = today.toISOString().split('T')[0];
    if (preset === 'today') { from = to; }
    else if (preset === 'week') {
        const d = new Date(today); d.setDate(d.getDate() - 6);
        from = d.toISOString().split('T')[0];
    } else if (preset === 'month') {
        from = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
    } else if (preset === 'year') {
        from = new Date(today.getFullYear(), 0, 1).toISOString().split('T')[0];
    }
    document.querySelector('[name="fromDate"]').value = from;
    document.querySelector('[name="toDate"]').value = to;
}
</script>
</th:block>
</html>
