<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, null, null, 'notifications', 'Notifications')}">
<th:block th:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4 mt-2">
    <div>
        <h5 class="fw-bold mb-1">Notifications</h5>
        <span class="badge bg-danger" th:if="${unreadCount > 0}" th:text="${unreadCount} + ' Unread'"></span>
    </div>
    <form th:action="@{/notifications/mark-all-read}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-outline-primary btn-sm">
            <i class="fas fa-check-double me-1"></i>Mark All Read
        </button>
    </form>
</div>
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div th:each="n : ${notifications.content}"
             class="d-flex align-items-start p-3 border-bottom"
             th:classappend="${!n.isRead} ? 'bg-primary-subtle' : ''">
            <div class="me-3 mt-1">
                <i th:classappend="${n.notificationType.name() == 'BIRTHDAY_REMINDER'} ? 'fas fa-birthday-cake text-warning' :
                                   (${n.notificationType.name() == 'FOLLOWUP_REMINDER'} ? 'fas fa-phone-alt text-primary' :
                                   (${n.notificationType.name() == 'EMI_DUE'} ? 'fas fa-rupee-sign text-danger' : 'fas fa-bell text-secondary'))"></i>
            </div>
            <div class="flex-grow-1">
                <div class="fw-semibold" th:text="${n.title}"></div>
                <div class="text-muted small" th:text="${n.message}"></div>
                <div class="text-muted" style="font-size:11px;" th:text="${#temporals.format(n.createdAt,'dd-MM-yyyy HH:mm')}"></div>
            </div>
            <div>
                <span th:if="${!n.isRead}" class="badge bg-primary rounded-pill">New</span>
            </div>
        </div>
        <div th:if="${notifications.empty}" class="text-center py-5 text-muted">
            <i class="fas fa-bell-slash fa-3x mb-3 d-block opacity-25"></i>
            No notifications yet.
        </div>
    </div>
</div>
</th:block>
</html>
