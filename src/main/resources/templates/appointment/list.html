<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, null, null, 'appointments', 'Appointments')}">
<th:block th:fragment="content">

<div class="d-flex justify-content-between align-items-center mb-4 mt-2">
    <div>
        <h5 class="mb-1 fw-bold">Appointment Management</h5>
        <p class="text-muted small mb-0">Viewing:
            <strong th:text="${#temporals.format(viewDate,'EEEE, dd MMMM yyyy')}"></strong>
        </p>
    </div>
    <a th:href="@{/appointments/new}" class="btn btn-primary">
        <i class="fas fa-plus me-2"></i>New Appointment
    </a>
</div>

<!-- Date Navigation -->
<div class="card border-0 shadow-sm mb-3">
    <div class="card-body py-2 d-flex align-items-center gap-3 flex-wrap">
        <a th:href="@{/appointments(date=${viewDate.minusDays(1)})}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-chevron-left"></i>
        </a>
        <form th:action="@{/appointments}" method="get" class="d-flex gap-2 align-items-center">
            <input type="date" name="date" class="form-control form-control-sm"
                   th:value="${viewDate}" style="width:160px;"/>
            <button class="btn btn-primary btn-sm">Go</button>
        </form>
        <a th:href="@{/appointments(date=${viewDate.plusDays(1)})}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-chevron-right"></i>
        </a>
        <a th:href="@{/appointments}" class="btn btn-outline-info btn-sm">Today</a>
        <span class="ms-auto text-muted small">
            <strong th:text="${totalToday}">0</strong> appointments today
        </span>
    </div>
</div>

<!-- Appointments Table -->
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Time</th>
                        <th>Customer</th>
                        <th>Type</th>
                        <th>Location</th>
                        <th>Assigned To</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${appointments}">
                        <td>
                            <div class="fw-semibold" th:text="${a.appointmentTime}"></div>
                            <div class="text-muted small" th:text="${a.durationMinutes + ' min'}"></div>
                        </td>
                        <td>
                            <div class="fw-semibold" th:text="${a.customer.customerName}"></div>
                            <div class="text-muted small" th:text="${a.customer.mobileNumber}"></div>
                        </td>
                        <td>
                            <span class="badge bg-info-subtle text-info"
                                  th:text="${a.appointmentType.name().replace('_',' ')}"></span>
                        </td>
                        <td class="small" th:text="${a.location ?: '-'}"></td>
                        <td class="small" th:text="${a.assignedTo != null ? a.assignedTo.fullName : '-'}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${a.status.name()=='COMPLETED'} ? 'bg-success' :
                                                  (${a.status.name()=='CANCELLED'}  ? 'bg-danger' :
                                                  (${a.status.name()=='CONFIRMED'}  ? 'bg-primary' : 'bg-warning text-dark'))"
                                  th:text="${a.status}"></span>
                        </td>
                        <td>
                            <div class="d-flex gap-1 flex-wrap">

                                <!-- Mark Complete -->
                                <form th:if="${a.status.name() != 'COMPLETED'}"
                                      th:action="@{/appointments/{id}/update-status(id=${a.id})}"
                                      method="post" class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="status" value="COMPLETED"/>
                                    <button type="submit" class="btn btn-success btn-sm py-0 px-2" title="Mark Complete">
                                        <i class="fas fa-check"></i>
                                    </button>
                                </form>

                                <!-- Edit -->
                                <a th:href="@{/appointments/{id}/edit(id=${a.id})}"
                                   class="btn btn-outline-primary btn-sm py-0 px-2" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </a>

                                <!-- WhatsApp -->
                                <a th:href="'https://wa.me/91' + ${a.customer.mobileNumber}"
                                   target="_blank"
                                   class="btn btn-success btn-sm py-0 px-2" title="WhatsApp">
                                    <i class="fab fa-whatsapp"></i>
                                </a>

                                <!-- Delete -->
                                <form th:action="@{/appointments/{id}/delete(id=${a.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this appointment?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-outline-danger btn-sm py-0 px-2" title="Delete">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>

                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(appointments)}">
                        <td colspan="7" class="text-center py-5 text-muted">
                            <i class="fas fa-calendar-times fa-3x mb-3 d-block opacity-25"></i>
                            No appointments for this date.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</th:block>
</html>
