# =============================================
# Financial CRM - Application Configuration
# =============================================

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.servlet.session.timeout=30m
server.error.whitelabel.enabled=false

# Application Info
spring.application.name=SS Services LLP
app.name=Financial CRM & Reception Management System
app.version=1.0.0
app.company=SS Services LLP

# =============================================
# Database Configuration
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/financial_crm?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=ShivamZ5203U
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.pool-name=FinancialCRM-Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# =============================================
# JPA / Hibernate Configuration
# =============================================
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# =============================================
# Thymeleaf Configuration
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =============================================
# Spring Security
# =============================================
#spring.security.user.name=admin
#spring.security.user.password=admin123

# =============================================
# File Upload Configuration
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/
app.employee.photo.dir=uploads/employees/
app.report.dir=reports/

# =============================================
# Mail Configuration
# NOTE: Set spring.mail.enabled=true and provide real credentials before enabling.
# Disabled auto-configuration to prevent startup failure with placeholder credentials.
# =============================================
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=shivamsonawane767@gmail.com
spring.mail.password=cxetnuyohvxciomy
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
app.base-url=http://localhost:8080

# =============================================
# PhonePe Payment Gateway
# =============================================
# Set enabled=true after PhonePe merchant onboarding and credential setup.
app.payment.phonepe.enabled=true
# UAT / sandbox:
# https://api-preprod.phonepe.com/apis/pg-sandbox
# Production:
# https://api.phonepe.com/apis/hermes
app.payment.phonepe.base-url=https://api-preprod.phonepe.com/apis/pg-sandbox
app.payment.phonepe.merchant-id=
app.payment.phonepe.salt-key=
app.payment.phonepe.salt-index=1

# =============================================
# Logging Configuration
# =============================================
logging.level.com.financialcrm=INFO
#logging.level.org.springframework.security=WARN
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/financial-crm.log
# Spring Boot 3.x rolling policy properties (replaces deprecated logging.file.max-*)
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================
# Actuator
# =============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# =============================================
# Cache
# =============================================
spring.cache.type=simple

# =============================================
# WhatsApp / SMS Integration (API-ready)
# =============================================
app.whatsapp.api.url=https://api.whatsapp.com/send
app.whatsapp.api.key=your-whatsapp-api-key
app.sms.api.url=https://api.sms-provider.com/send
app.sms.api.key=your-sms-api-key
app.sms.sender.id=FINCRM

# =============================================
# Scheduler
# =============================================
spring.task.scheduling.pool.size=5

# =============================================
# Timezone
# =============================================
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=dd-MM-yyyy HH:mm:ss
# ==============================================

# =============================================
# Twilio WhatsApp Configuration
# =============================================
twilio.account.sid=false
twilio.auth.token=false
# For sandbox use: whatsapp:+14155238886
# For production: whatsapp:+YOUR_TWILIO_WHATSAPP_NUMBER
twilio.whatsapp.from=whatsapp:+14155238886

# Birthday/Anniversary WhatsApp scheduler - runs every day at 9:00 AM IST
app.whatsapp.birthday.cron=0 0 9 * * *
app.whatsapp.anniversary.cron=0 0 9 * * *

# Birthday/Anniversary EMAIL scheduler - runs every day at 9:00 AM IST
app.email.birthday.cron=0 0 9 * * *
app.email.anniversary.cron=0 0 9 * * *