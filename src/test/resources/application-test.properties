# =============================================
# Test Application Properties
# Uses H2 in-memory database instead of MySQL
# =============================================

# Use H2 in-memory database for tests (no MySQL required)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable mail auto-configuration for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Thymeleaf
spring.thymeleaf.cache=false

# Disable some non-critical features for tests
spring.jpa.open-in-view=false

# Logging (quiet for tests)
logging.level.com.financialcrm=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Cache
spring.cache.type=simple
